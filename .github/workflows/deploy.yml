name: CI

env:
  ARTIFACTORY_USERNAME: ${{ secrets.ARTIFACTORY_USERNAME }}
  ARTIFACTORY_PASSWORD: ${{ secrets.ARTIFACTORY_PASSWORD }}
  KINDLEGEN: /home/runner/bin/kindlegen/kindlegen
  GIT_PASSWORD: ${{ secrets.GIT_PASSWORD }}
  GIT_USERNAME: ${{ secrets.GIT_USERNAME }}
  AWS_REGION: ${{ secrets.AWS_REGION }}
  AWS_ACCESS_KEY_ID: ${{ secrets.AWS_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
  TOOLBOOK_API_KEY: ${{ secrets.TOOLBOOK_API_KEY }}

on:
  # the next bit is very important:
  # the sample-book will fire an update-event (that this will listen for)
  # that will force this CI pipeline to build the book anew
  repository_dispatch:
    types: update-event
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

defaults:
  run:
    # the runner default is `bash -e {0}`, which has no pipefail: a failing
    # command on the left of a pipe would be masked by a successful one on the
    # right. `shell: bash` gives us `bash --noprofile --norc -eo pipefail {0}`.
    shell: bash

jobs:

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:

      - name: configure Kindlegen directory
        run: mkdir -p "$(dirname "$KINDLEGEN")" && ls -la "$(dirname "$KINDLEGEN")"

      - uses: actions/checkout@v5

      - uses: graalvm/setup-graalvm@v1
        with:
          java-version: '25'
          distribution: 'graalvm-community' # Or 'graalvm-community'
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache: 'maven'

      - name: configure optimizer binaries
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ghostscript pandoc
          sudo gem install asciidoctor asciidoctor-pdf rghost
          which ghostscript
          which asciidoctor-pdf-optimize

      - name: build and run
        timeout-minutes: 45
        run: .github/workflows/build.sh

      - name: upload pipeline log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pipeline-run-log
          path: target/pipeline-run.log
          if-no-files-found: ignore
      
      - name: sync with Toolbook
        run: |

          set -euo pipefail
          find . 

          # GitHub Actions step; chapter files are named like 01-preface.md
          auth=(-H "Authorization: Bearer $TOOLBOOK_API_KEY")
          base="$TOOLBOOK_API_URL/toolbooks/bootiful-spring-ai"

          curl --fail-with-body -X DELETE "${auth[@]}" "$base/chapters"
          for chapter in chapters/*.md; do
            filename="${chapter##*/}"
            chapter_slug="$filename"
            curl --fail-with-body -X POST "${auth[@]}" \
              -H 'Content-Type: text/markdown' --data-binary "@$chapter" \
              "$base/chapters/$chapter_slug"
          done
          # Remove this line when the pipeline should update only the draft.
          curl --fail-with-body -X POST "${auth[@]}" "$base/versions/promote
